# Fly.io configuration for DodoStays API
# Deploy: flyctl deploy --remote-only
# Logs: flyctl logs -a dodostays-api

app = "dodostays-api"
primary_region = "sin"  # Singapore — ~150ms latency to Mauritius

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"

  # Hangfire background jobs
  Hangfire__DashboardEnabled = "true"
  Hangfire__DashboardPath = "/jobs"

  # CORS — allow frontend origins
  Cors__AllowedOrigins__0 = "https://dodostays-web.fly.dev"
  Cors__AllowedOrigins__1 = "https://dodostays.com"
  Cors__AllowedOrigins__2 = "https://www.dodostays.com"
  # Cloudflare Pages waitlist landing page + custom domain
  Cors__AllowedOrigins__3 = "https://dodostays.mu"
  Cors__AllowedOrigins__4 = "https://www.dodostays.mu"
  Cors__AllowedOrigins__5 = "https://dodostays-waitlist.pages.dev"

  # Third-party providers (InMemory/Log for MVP, real providers when ready)
  Payments__Provider = "InMemory"
  Payouts__Provider = "InMemory"
  Email__Provider = "Log"
  Sms__Provider = "Log"
  Fx__Provider = "Fixed"
  Kyc__Provider = "InMemory"

  # Photo storage — mounted volume at /data
  PhotoStorage__Provider = "Local"
  PhotoStorage__LocalRoot = "/data/photos"
  PhotoStorage__PublicBaseUrl = "https://dodostays-api.fly.dev/photos"

  # --- Cloudflare R2 (durable, S3-compatible object storage) — recommended for production ---
  # To enable, flip the providers to "R2" and set the R2 credentials as SECRETS (never in this
  # file). Invoices are private (read back through the API); photos are public via PublicBaseUrl.
  #   Invoicing__StorageProvider = "R2"
  #   PhotoStorage__Provider     = "R2"
  #   PhotoStorage__PublicBaseUrl = "https://<your-r2-public-domain>"
  # Secrets to set with `flyctl secrets set` (see DEPLOY.md → Cloudflare R2 storage):
  #   Invoicing__R2AccountId / Invoicing__R2AccessKeyId / Invoicing__R2SecretAccessKey / Invoicing__R2Bucket
  #   PhotoStorage__R2AccountId / PhotoStorage__R2AccessKeyId / PhotoStorage__R2SecretAccessKey / PhotoStorage__R2Bucket

  # Email/SMS log output — mounted volume at /data
  Email__OutputDir = "/data/emails"
  Sms__OutputDir = "/data/sms"

# Invoice storage: set Invoicing__StorageProvider=R2 (see R2 block below) to store invoice PDFs
# durably in Cloudflare R2. When left as "Local" (the default), invoices write to
# /app/wwwroot/invoices, which is ephemeral — it survives rolling deploys but NOT machine
# replacement — so R2 is recommended for production.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0  # Scale to zero when idle (first request after sleep ~3-5s)
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Persistent volume for photos/emails/sms (invoices are ephemeral until we refactor or add symlinks)
[mounts]
  source = "dodostays_api_data"
  destination = "/data"
  initial_size = "5gb"

# Secrets (set via flyctl secrets set):
# - ConnectionStrings__Postgres — Postgres connection string from `flyctl postgres attach`
# - Jwt__SigningKey — HMAC signing key (generate with `openssl rand -hex 32`)
# - Jwt__Issuer — "dodostays"
# - Jwt__Audience — "dodostays"
# - Ical__SigningKey — iCal feed signing key (32+ chars)
# - Ical__FeedBaseUrl — "https://dodostays-api.fly.dev"
# - NlParser__AnthropicApiKey — Claude API key (optional, InMemory parser works without it)
#
# Cloudflare R2 storage (only when the R2 providers above are enabled):
# - Invoicing__R2AccountId / Invoicing__R2AccessKeyId / Invoicing__R2SecretAccessKey / Invoicing__R2Bucket
# - PhotoStorage__R2AccountId / PhotoStorage__R2AccessKeyId / PhotoStorage__R2SecretAccessKey / PhotoStorage__R2Bucket
